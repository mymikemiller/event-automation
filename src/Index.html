<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Automation</title>
  <style>
    :root {
      --blue: #1a73e8;
      --blue-dark: #174ea6;
      --blue-soft: #e8f0fe;
      --green: #34a853;
      --red: #c5221f;
      --amber: #b06000;
      --ink: #202124;
      --ink-soft: #5f6368;
      --line: #dadce0;
      --bg: #f1f3f4;
      --card: #ffffff;
      --radius: 10px;
      --tap: 48px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 16px root, and no phone-initiated text inflation. */
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.5;
      padding: 12px 12px 16px;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 12px; color: var(--blue); }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
      margin-bottom: 14px;
    }

    .card-title {
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-soft);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    label, .field-label {
      display: block;
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink-soft);
    }

    /* font-size must stay at 1rem/16px: anything smaller makes mobile
       browsers zoom the page when the field takes focus. */
    input, textarea {
      width: 100%;
      min-height: var(--tap);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-family: inherit;
      line-height: 1.4;
      color: var(--ink);
      background: #fff;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px var(--blue-soft);
    }
    textarea { min-height: 160px; resize: vertical; }

    /* Both of these are paste targets, so they open roomy. */
    #paste-input { min-height: 260px; }
    #f-description { min-height: 180px; }

    button {
      width: 100%;
      min-height: 52px;
      padding: 14px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:disabled { background: #bdc1c6; cursor: not-allowed; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-secondary { background: #fff; color: var(--ink-soft); border: 1px solid var(--line); }

    /* Keeps the primary action reachable without scrolling to the end of a
       long form. Where sticky does not engage (card shorter than the
       viewport, or an iframe sized to full content height) this degrades to
       normal flow at the bottom of the card -- where the button already was. */
    .action-bar {
      position: sticky;
      bottom: 0;
      z-index: 10;
      background: var(--card);
      margin: 14px -16px -16px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    /* Sits outside the cards, spanning the whole confirm form, so the primary
       action stays on screen no matter which field you are editing. */
    .action-bar.floating {
      margin: 0 0 14px;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 -2px 10px rgba(60,64,67,.16);
    }
    .action-bar button { margin-top: 0; }
    .action-bar button + button { margin-top: 8px; }

    /* A pinned bar costs screen space for the whole scroll, so the pair share
       one row instead of stacking. row-reverse puts the primary (first in DOM,
       for tab order) on the right, where a thumb reaches it. */
    .action-bar.split { display: flex; flex-direction: row-reverse; gap: 10px; }
    .action-bar.split button { width: auto; margin-top: 0; padding: 14px 10px; }
    .action-bar.split .btn-primary, .action-bar.split .btn-success { flex: 2 1 0; }
    .action-bar.split .btn-secondary { flex: 1 1 0; }

    .status { padding: 12px 14px; border-radius: 8px; margin-bottom: 12px; font-size: .95rem; }
    .status.info { background: var(--blue-soft); color: var(--blue-dark); }
    .status.warn { background: #fef7e0; color: var(--amber); border: 1px solid #f9c840; }
    .status.error { background: #fce8e6; color: var(--red); }
    .status.success { background: #e6f4ea; color: #137333; }

    .login-wall-notice {
      background: #fff3e0; border: 1px solid #ff9800; border-radius: 8px;
      padding: 14px; margin-bottom: 14px; font-size: .95rem; color: #5d3a00;
    }
    .login-wall-notice strong { display: block; margin-bottom: 6px; font-size: 1rem; color: #e65100; }
    .login-wall-notice a { color: var(--blue); font-weight: 600; }

    .field-group { margin-bottom: 16px; }
    .field-group:last-child { margin-bottom: 0; }
    .warning-note { font-size: .88rem; color: var(--amber); margin-top: 6px; }

    #url-section, #confirm-section, #result-section { display: none; }
    #url-section { display: block; }

    a.link-btn {
      display: block; text-align: center; min-height: var(--tap);
      padding: 14px; border-radius: 8px; background: var(--blue-soft);
      color: var(--blue); text-decoration: none; font-weight: 600; margin-top: 10px;
    }

    .img-preview {
      display: block; width: 100%; max-height: 60vh; object-fit: contain;
      margin-top: 12px; border-radius: 8px; border: 1px solid var(--line); background: #f8f9fa;
    }
    .img-preview-fallback {
      margin-top: 12px; padding: 12px 14px; border-radius: 8px;
      font-size: .9rem; background: var(--bg); color: var(--ink-soft); border: 1px solid var(--line);
    }

    .rec-banner {
      padding: 12px 14px; border-radius: 8px; margin-bottom: 12px;
      font-size: .92rem; background: var(--blue-soft); color: var(--blue-dark); border: 1px solid #c5d3f0;
    }
    .rec-banner.checking { background: var(--bg); color: var(--ink-soft); border-color: var(--line); }
    .rec-banner.single { background: var(--bg); color: var(--ink-soft); border-color: var(--line); }

    /* One occurrence per card. The old single-line layout squeezed a date,
       two times and a remove button onto one row -- unusable on a phone. */
    .date-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fbfbfb;
    }
    .date-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .date-card-head .n {
      flex: 1 1 auto;
      font-size: .78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--ink-soft);
    }
    .date-card .rm {
      flex: 0 0 auto;
      width: 40px; min-width: 40px; min-height: 40px;
      margin: 0; padding: 0;
      background: transparent; color: var(--red);
      font-size: 1.2rem; line-height: 1; border-radius: 8px;
    }
    .date-card .rm:active { background: #fce8e6; }
    .diff-tag {
      flex: 0 0 auto;
      font-size: .7rem; font-weight: 700; color: var(--amber);
      background: #fef7e0; border: 1px solid #f9c840;
      border-radius: 4px; padding: 3px 6px; white-space: nowrap;
    }
    .time-row { display: flex; gap: 10px; margin-top: 10px; }
    .time-row > div { flex: 1 1 0; min-width: 0; }
    .time-row .field-label { font-size: .82rem; margin-bottom: 4px; }

    .btn-add-date {
      width: 100%; min-height: var(--tap); padding: 12px;
      font-size: .95rem; background: var(--blue-soft); color: var(--blue); margin-top: 4px;
    }

    #result-title { font-size: 1.15rem; font-weight: 600; margin: 10px 0 4px; }
    #img-url-text { margin-top: 8px; font-size: .85rem; color: var(--ink-soft); }

    /* Roomier on a desktop window, where vertical space is cheap. */
    @media (min-width: 700px) {
      body { padding: 24px 24px 32px; }
      h1 { font-size: 1.6rem; margin-bottom: 20px; }
      .card { padding: 24px; }
      .action-bar { margin: 20px -24px -24px; padding: 16px 24px; }
      .action-bar.floating { margin: 0 0 20px; padding: 16px; }
      .action-bar button + button { margin-top: 0; }
    }
  </style>
</head>
<body>
  <h1>Event Automation</h1>

  <!-- Step 1: URL Input -->
  <div id="url-section" class="card">
    <div class="field-group">
      <label for="url-input">Event Page URL</label>
      <input type="url" id="url-input" placeholder="https://..." autocomplete="off"
             inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
             value="<?= prefillUrl ?>">
    </div>
    <div id="url-status"></div>
    <div class="action-bar">
      <button class="btn-primary" id="extract-btn" onclick="extractEvent()">Extract Event Info</button>
    </div>
  </div>

  <!-- Step 1b: Paste content (shown when page is behind a login wall) -->
  <div id="paste-section" style="display:none">
    <div class="login-wall-notice" id="paste-login-notice"></div>
    <div class="card">
      <div class="field-group">
        <label for="paste-input">Paste the event post content</label>
        <textarea id="paste-input" placeholder="Open the event in your browser, close the login popup, select the event text, and paste it here..."></textarea>
      </div>
      <div id="paste-status"></div>
      <div class="action-bar split">
        <button class="btn-primary" id="paste-btn" onclick="extractFromPasted()">Extract Event Info</button>
        <button class="btn-secondary" onclick="reset()">Start Over</button>
      </div>
    </div>
  </div>

  <!-- Step 2: Confirmation Form -->
  <div id="confirm-section">
    <div id="confirm-status"></div>

    <div class="card">
      <div class="card-title">Event</div>
      <div class="field-group">
        <label for="f-title">Title *</label>
        <input type="text" id="f-title">
      </div>
      <div class="field-group">
        <div id="recurrence-banner" class="rec-banner"></div>
        <label>Dates *</label>
        <div id="date-rows"></div>
        <button type="button" class="btn-add-date" onclick="addDateRow()">+ Add date</button>
        <div id="end-time-note" class="warning-note"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Details</div>
      <div class="field-group">
        <label for="f-location">Location</label>
        <input type="text" id="f-location">
      </div>
      <div class="field-group">
        <label for="f-description">Description</label>
        <textarea id="f-description"></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Media &amp; link</div>
      <div class="field-group">
        <label for="f-link-label">Source Link Label</label>
        <input type="text" id="f-link-label">
      </div>
      <div class="field-group">
        <label for="f-image-url">Image URL</label>
        <input type="url" id="f-image-url" oninput="queueImagePreview()"
               inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
        <img id="f-image-preview" class="img-preview" alt="Event image preview" style="display:none">
        <div id="f-image-preview-fallback" class="img-preview-fallback" style="display:none">
          Image preview unavailable &mdash; check the URL, or the link may have expired.
        </div>
      </div>
    </div>

    <div id="submit-status"></div>
    <div class="action-bar floating split">
      <button class="btn-success" id="submit-btn" onclick="submitEvent()">Create Calendar Event</button>
      <button class="btn-secondary" onclick="reset()">Start Over</button>
    </div>
  </div>

  <!-- Step 3: Result -->
  <div id="result-section" class="card">
    <div id="result-status"></div>
    <div id="result-title" style="display:none"></div>
    <div id="result-links"></div>
    <div class="action-bar">
      <button class="btn-primary" onclick="reset()">Add Another Event</button>
    </div>
  </div>

  <script>
    // Web app URL embedded at serve time by doGet() — reliably set here
    var WEB_APP_URL = '<?= webAppUrl ?>';

    var sourceUrl = '';

    // ── Utilities ─────────────────────────────────────────────────────────────

    function setStatus(elId, type, msg) {
      var el = document.getElementById(elId);
      el.className = 'status ' + type;
      el.textContent = msg;
    }
    function clearStatus(elId) {
      var el = document.getElementById(elId);
      el.className = '';
      el.textContent = '';
    }
    function show(id) { document.getElementById(id).style.display = 'block'; }
    function hide(id) { document.getElementById(id).style.display = 'none'; }

    function extractEvent() {
      var url = document.getElementById('url-input').value.trim();
      if (!url) { setStatus('url-status', 'error', 'Please enter a URL.'); return; }

      sourceUrl = url;
      document.getElementById('extract-btn').disabled = true;
      setStatus('url-status', 'info', 'Fetching page and extracting event info...');

      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('extract-btn').disabled = false;
          if (result.error) {
            setStatus('url-status', 'error', result.error);
            return;
          }
          if (result.allowPaste) {
            showPasteSection(result.error, result.originalUrl);
            return;
          }
          populateForm(result.data);
        })
        .withFailureHandler(function(err) {
          document.getElementById('extract-btn').disabled = false;
          setStatus('url-status', 'error', 'Unexpected error: ' + err.message);
        })
        .processEventUrl(url);
    }

    function showPasteSection(message, originalUrl) {
      var link = originalUrl
        ? ' <a href="' + originalUrl + '" target="_blank">Open the original page</a>, close any popup, copy the event text, and paste it below.'
        : '';
      document.getElementById('paste-login-notice').innerHTML =
        '<strong>&#9888; Could not read that page automatically</strong>' +
        message + link;
      hide('url-section');
      show('paste-section');
      document.getElementById('paste-input').focus();
    }

    function extractFromPasted() {
      var text = document.getElementById('paste-input').value.trim();
      if (!text) { setStatus('paste-status', 'error', 'Please paste some content first.'); return; }
      document.getElementById('paste-btn').disabled = true;
      setStatus('paste-status', 'info', 'Extracting event info...');
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('paste-btn').disabled = false;
          if (result.error) { setStatus('paste-status', 'error', result.error); return; }
          hide('paste-section');
          populateForm(result.data);
        })
        .withFailureHandler(function(err) {
          document.getElementById('paste-btn').disabled = false;
          setStatus('paste-status', 'error', 'Unexpected error: ' + err.message);
        })
        .processEventText(text, sourceUrl);
    }

    // ── Date rows ─────────────────────────────────────────────────────────────

    var planTimer = null;

    function addDateRow(date, start, end) {
      var rows = document.getElementById('date-rows');
      // A new row defaults to one interval past the last, keeping the pattern.
      if (!date && rows.children.length) {
        var existing = readDateRows();
        var last = existing[existing.length - 1];
        var step = existing.length > 1
          ? (Date.parse(last.date) - Date.parse(existing[existing.length - 2].date)) / 86400000
          : 7;
        date = new Date(Date.parse(last.date) + step * 86400000).toISOString().slice(0, 10);
        // Inherit the SERIES time, not the last row's — the last row may itself
        // be a one-off exception, and cloning it would silently create another.
        var common = commonRowTime_(existing);
        start = start || common.start_time;
        end = end || common.end_time;
      }

      // Input ORDER is a contract: readDateRows() and renderPlan() index
      // getElementsByTagName('input') as [date, start, end]. The .diff-tag and
      // .rm class names are looked up the same way. Keep all three stable.
      var row = document.createElement('div');
      row.className = 'date-card';
      row.innerHTML =
        '<div class="date-card-head">' +
          '<span class="n"></span>' +
          '<span class="diff-tag" style="display:none">diff time</span>' +
          '<button type="button" class="rm" onclick="removeDateRow(this)" title="Remove date">&#10005;</button>' +
        '</div>' +
        '<input type="date" value="' + (date || '') + '" oninput="onDatesChanged()">' +
        '<div class="time-row">' +
          '<div>' +
            '<span class="field-label">Starts</span>' +
            '<input type="time" value="' + (start || '') + '" oninput="onDatesChanged()">' +
          '</div>' +
          '<div>' +
            '<span class="field-label">Ends</span>' +
            '<input type="time" value="' + (end || '') + '" oninput="onDatesChanged()">' +
          '</div>' +
        '</div>';
      rows.appendChild(row);
      onDatesChanged();
    }

    // Most common start/end among the current rows. Only used to pre-fill a new
    // row; the server's planner remains the authority on the actual series time.
    function commonRowTime_(rows) {
      var counts = {};
      rows.forEach(function (r) {
        var k = r.start_time + '|' + r.end_time;
        counts[k] = (counts[k] || 0) + 1;
      });
      var best = rows[0];
      var bestN = 0;
      rows.forEach(function (r) {
        var n = counts[r.start_time + '|' + r.end_time];
        if (n > bestN) { bestN = n; best = r; }
      });
      return { start_time: best.start_time, end_time: best.end_time };
    }

    function removeDateRow(btn) {
      var rows = document.getElementById('date-rows');
      if (rows.children.length <= 1) return;
      // The button is nested inside .date-card-head now, so parentNode is the
      // header rather than the card itself.
      rows.removeChild(btn.closest('.date-card'));
      onDatesChanged();
    }

    function readDateRows() {
      var out = [];
      var rows = document.getElementById('date-rows').children;
      for (var i = 0; i < rows.length; i++) {
        var inputs = rows[i].getElementsByTagName('input');
        out.push({ date: inputs[0].value, start_time: inputs[1].value, end_time: inputs[2].value || null });
      }
      return out;
    }

    function onDatesChanged() {
      var rows = document.getElementById('date-rows').children;
      // The remove control is meaningless on the only row.
      for (var i = 0; i < rows.length; i++) {
        rows[i].getElementsByClassName('rm')[0].style.visibility =
          rows.length > 1 ? 'visible' : 'hidden';
        // Stacked cards lose the visual run of a list, so each states its place.
        rows[i].getElementsByClassName('n')[0].textContent =
          rows.length > 1 ? 'Date ' + (i + 1) + ' of ' + rows.length : 'Date';
      }

      var occ = readDateRows().filter(function (o) { return o.date && o.start_time; });
      var banner = document.getElementById('recurrence-banner');
      if (!occ.length) {
        banner.className = 'rec-banner single';
        banner.textContent = 'Add at least one date.';
        return;
      }

      banner.className = 'rec-banner checking';
      banner.textContent = 'Checking dates…';

      clearTimeout(planTimer);
      planTimer = setTimeout(function () {
        google.script.run
          .withSuccessHandler(renderPlan)
          .withFailureHandler(function () {
            banner.className = 'rec-banner single';
            banner.textContent = 'Could not preview the schedule — it will still be checked when you submit.';
          })
          .planRecurrence(occ);
      }, 400);
    }

    function renderPlan(plan) {
      var banner = document.getElementById('recurrence-banner');
      banner.className = 'rec-banner' + (plan.method === 'single' ? ' single' : '');
      banner.textContent = (plan.method === 'single' ? '' : '↻ ') + plan.summary;

      // Flag rows whose time differs from the series.
      var rows = document.getElementById('date-rows').children;
      var flagged = {};
      (plan.dates || []).forEach(function (d) { if (d.isException) flagged[d.date] = true; });
      for (var i = 0; i < rows.length; i++) {
        var d = rows[i].getElementsByTagName('input')[0].value;
        rows[i].getElementsByClassName('diff-tag')[0].style.display = flagged[d] ? 'inline' : 'none';
      }
    }

    function populateForm(data) {
      document.getElementById('f-title').value = data.title || '';

      var rows = document.getElementById('date-rows');
      rows.innerHTML = '';
      var occ = (data.occurrences && data.occurrences.length)
        ? data.occurrences
        : [{ date: data.date, start_time: data.start_time, end_time: data.end_time }];
      occ.forEach(function (o) { addDateRow(o.date || '', o.start_time || '', o.end_time || ''); });

      document.getElementById('f-location').value = data.location || '';
      document.getElementById('f-description').value = data.description || '';
      document.getElementById('f-link-label').value = data.source_link_label || 'See Website for details';
      document.getElementById('f-image-url').value = data.image_url || '';
      updateImagePreview();

      // Show end time note if guessed
      var noteEl = document.getElementById('end-time-note');
      noteEl.textContent = data.end_time_note ? '⚠ ' + data.end_time_note : '';

      // Show warnings for missing optional fields
      var warnings = [];
      if (!data.location) warnings.push('location');
      if (!data.description) warnings.push('description');
      if (!data.image_url) warnings.push('image URL');

      clearStatus('confirm-status');
      if (warnings.length) {
        setStatus('confirm-status', 'warn', 'Could not find: ' + warnings.join(', ') + '. You can fill these in manually.');
      }

      hide('url-section');
      show('confirm-section');
    }

    function submitEvent() {
      var title = document.getElementById('f-title').value.trim();
      var occurrences = readDateRows();

      if (!title) { setStatus('submit-status', 'error', 'Title is required.'); return; }
      if (!occurrences.length) { setStatus('submit-status', 'error', 'Add at least one date.'); return; }

      var seen = {};
      for (var i = 0; i < occurrences.length; i++) {
        if (!occurrences[i].date || !occurrences[i].start_time) {
          setStatus('submit-status', 'error', 'Every date needs a date and a start time.');
          return;
        }
        if (seen[occurrences[i].date]) {
          setStatus('submit-status', 'error', 'Duplicate date: ' + occurrences[i].date);
          return;
        }
        seen[occurrences[i].date] = true;
      }

      document.getElementById('submit-btn').disabled = true;
      setStatus('submit-status', 'info', occurrences.length > 1
        ? 'Creating calendar event for ' + occurrences.length + ' dates and saving image...'
        : 'Creating calendar event and saving image...');

      var eventData = {
        title: title,
        occurrences: occurrences,
        location: document.getElementById('f-location').value.trim(),
        description: document.getElementById('f-description').value.trim(),
        source_link_label: document.getElementById('f-link-label').value.trim(),
        image_url: document.getElementById('f-image-url').value.trim(),
        source_url: sourceUrl
      };

      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('submit-btn').disabled = false;
          if (result.error) {
            setStatus('submit-status', 'error', result.error +
              (result.partial && result.partial.driveUrl ? ' Image was saved: ' + result.partial.driveUrl : ''));
            return;
          }
          showResult(result);
        })
        .withFailureHandler(function(err) {
          document.getElementById('submit-btn').disabled = false;
          setStatus('submit-status', 'error', 'Unexpected error: ' + err.message);
        })
        .submitEvent(eventData);
    }

    function showResult(result) {
      hide('url-section');
      hide('confirm-section');
      show('result-section');

      var statusMsg = result.occurrenceCount > 1
        ? (result.method === 'duplicate'
            ? 'Created ' + result.occurrenceCount + ' separate events.'
            : 'Created one repeating event with ' + result.occurrenceCount + ' occurrences.')
        : 'Event created successfully!';
      var statusType = 'success';

      if (result.duplicateDates && result.duplicateDates.length) {
        statusMsg += ' Note: ' + result.duplicateDates.length + ' of ' + result.occurrenceCount +
                     ' date(s) already had an event with this title (' +
                     result.duplicateDates.join(', ') + ').';
        statusType = 'warn';
      }
      if (result.warnings && result.warnings.length) {
        statusMsg += ' ' + result.warnings.join(' ');
        statusType = 'warn';
      }
      if (result.attachmentWarning) {
        statusMsg += ' (Image saved to Drive but could not be attached: ' + result.attachmentWarning + ')';
        statusType = 'warn';
      }

      setStatus('result-status', statusType, statusMsg);
      if (result.title) {
        var titleEl = document.getElementById('result-title');
        titleEl.textContent = result.title;
        titleEl.style.display = 'block';
      }

      var links = '';
      if (result.calendarUrl) {
        links += '<a class="link-btn" href="' + result.calendarUrl + '" target="_blank">View Calendar Event</a>';
      }
      if (result.driveUrl) {
        links += '<a class="link-btn" href="' + result.driveUrl + '" target="_blank">View Image in Drive</a>';
      }
      if (result.imageUrl) {
        var safeUrl = escapeAttr(result.imageUrl);
        // Source images are often Facebook CDN links, whose signed tokens
        // expire — so a broken preview is expected sometimes, not an error.
        links += '<img class="img-preview" src="' + safeUrl + '" alt="Event image"' +
                 ' onerror="this.style.display=\'none\';' +
                 'document.getElementById(\'img-preview-fallback\').style.display=\'block\'">' +
                 '<div id="img-preview-fallback" class="img-preview-fallback" style="display:none">' +
                 'Image preview unavailable — the link may have expired. The URL below is still what was used.' +
                 '</div>' +
                 '<button id="copy-img-btn" onclick="copyImageUrl()" class="btn-secondary">Copy Image URL</button>' +
                 '<input id="img-url-text" type="text" readonly value="' + safeUrl + '">';
      }
      document.getElementById('result-links').innerHTML = links;
    }

    var imagePreviewTimer = null;

    /**
     * Redraws the preview after a pause, so editing the URL by hand doesn't
     * fire a request per keystroke.
     */
    function queueImagePreview() {
      clearTimeout(imagePreviewTimer);
      imagePreviewTimer = setTimeout(updateImagePreview, 400);
    }

    /**
     * Shows the image at the current URL on the review screen. A failed load
     * is expected rather than exceptional — source images are often Facebook
     * CDN links whose signed tokens expire — so it falls back to a note
     * instead of a broken-image icon.
     */
    function updateImagePreview() {
      var url = document.getElementById('f-image-url').value.trim();
      var img = document.getElementById('f-image-preview');
      var fallback = document.getElementById('f-image-preview-fallback');

      fallback.style.display = 'none';
      if (!url) {
        img.style.display = 'none';
        img.removeAttribute('src');
        return;
      }

      img.onload = function () {
        img.style.display = 'block';
        fallback.style.display = 'none';
      };
      img.onerror = function () {
        img.style.display = 'none';
        fallback.style.display = 'block';
      };
      img.src = url;
    }

    /**
     * Escapes a value for use inside a double-quoted HTML attribute. Image URLs
     * come from scraped pages, so they can carry quotes and ampersands that
     * would otherwise break out of the attribute.
     */
    function escapeAttr(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function copyImageUrl() {
      var input = document.getElementById('img-url-text');
      // execCommand('copy') is unreliable on mobile browsers; try the async
      // Clipboard API first and keep the old path as the fallback.
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(
          function () { flashCopied(); },
          function () { legacyCopy(input); }
        );
        return;
      }
      legacyCopy(input);
    }

    function legacyCopy(input) {
      input.removeAttribute('readonly');
      input.select();
      input.setSelectionRange(0, input.value.length);
      try { document.execCommand('copy'); flashCopied(); } catch (e) {}
      input.setAttribute('readonly', 'readonly');
    }

    function flashCopied() {
      var btn = document.getElementById('copy-img-btn');
      if (!btn) return;
      var original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function () { btn.textContent = original; }, 1500);
    }

    function reset() {
      document.getElementById('url-input').value = '';
      document.getElementById('paste-input').value = '';
      document.getElementById('result-title').style.display = 'none';
      document.getElementById('date-rows').innerHTML = '';
      document.getElementById('recurrence-banner').textContent = '';
      document.getElementById('recurrence-banner').className = 'rec-banner';
      sourceUrl = '';
      clearStatus('url-status');
      clearStatus('paste-status');
      hide('paste-section');
      hide('confirm-section');
      hide('result-section');
      show('url-section');
    }

    // Arriving from the "new Meetup event" mail, the box already holds the URL
    // (doGet fills it from ?url=), so there is nothing left to type — put the
    // cursor on the button instead of the field.
    if (document.getElementById('url-input').value) {
      document.getElementById('extract-btn').focus();
    }
  </script>
</body>
</html>
